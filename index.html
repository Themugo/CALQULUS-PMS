<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>CALQULUS PMS - Property Management</title>
    <meta name="description" content="CALQULUS PMS - Modern property management solution for landlords and tenants" />
    <meta name="author" content="CALQULUS PMS" />
    <link rel="canonical" href="https://www.calqulus.site/" />

    <!-- PWA Meta Tags -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="CALQULUS PMS" />
    <meta name="theme-color" content="#0A1628" />
    <meta name="format-detection" content="telephone=no" />

    <!-- Performance: Preconnect to critical origins -->
    <link rel="preconnect" href="https://aelzsqxllkypbzslxyju.supabase.co" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Performance: DNS Prefetch for third-party resources -->
    <link rel="dns-prefetch" href="https://images.unsplash.com" />
    <link rel="dns-prefetch" href="https://www.google-analytics.com" />

    <!-- PWA Icons -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="mask-icon" href="/mask-icon.svg" color="#0A1628" />

    <!-- Open Graph -->
    <meta property="og:title" content="CALQULUS PMS - Property Management" />
    <meta property="og:description" content="Modern property management solution for landlords and tenants" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.calqulus.site/" />
    <meta property="og:site_name" content="CALQULUS PMS" />
    <meta property="og:image" content="https://www.calqulus.site/pwa-512x512.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@CALQULUSPMS" />
    <meta name="twitter:image" content="https://www.calqulus.site/pwa-512x512.png" />

    <!-- Critical CSS for faster LCP -->
    <style>
      /* Prevent layout shift during loading */
      #root {
        min-height: 100vh;
      }
      /* Loading skeleton styles for instant paint */
      .initial-loader {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        background: linear-gradient(135deg, #0A1628 0%, #1a2744 100%);
      }
      .initial-loader-spinner {
        width: 48px;
        height: 48px;
        border: 4px solid rgba(201, 168, 76, 0.2);
        border-top-color: #C9A84C;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      /* Hide loading state once React mounts */
      #root:has(> *) .initial-loader {
        display: none;
      }
    </style>
  </head>

  <body>
    <div id="root">
      <!-- Critical: Show loading state before JS loads for better perceived performance -->
      <div class="initial-loader">
        <div class="initial-loader-spinner"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
