name: Production Deploy

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment environment
        required: true
        default: production
        type: choice
        options:
          - production
          - staging

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: "22"

jobs:
  # ── Pre-deployment Quality Gates ──────────────────────────────────
  pre-deploy-gate:
    name: Quality Gate Check
    runs-on: ubuntu-latest
    outputs:
      can_deploy: ${{ steps.evaluate.outputs.can_deploy }}
      deployment_notes: ${{ steps.evaluate.outputs.notes }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for production blocking issues
        id: evaluate
        run: |
          NOTES=""
          CAN_DEPLOY="true"
          
          # Check if this is a release tag
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            NOTES="Release tag detected: ${{ github.ref_name }}"
          else
            NOTES="Direct push to main branch"
          fi
          
          # Check for security updates needed
          if grep -q "security:\|fix:.*security\|CVE-" commit-msg.txt 2>/dev/null || \
             grep -q "security" package.json 2>/dev/null; then
            NOTES="$NOTES\n⚠️ Security-related changes detected"
          fi
          
          echo "can_deploy=$CAN_DEPLOY" >> $GITHUB_OUTPUT
          echo "notes=$NOTES" >> $GITHUB_OUTPUT

  # ── Build and Bundle Analysis ───────────────────────────────────────
  build:
    name: Production Build
    runs-on: ubuntu-latest
    needs: pre-deploy-gate
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Bundle size check
        run: |
          MAX_JS_SIZE=2500000  # 2.5MB max for main JS
          BUNDLE_SIZE=$(stat -c%s dist/assets/index-*.js 2>/dev/null | sort -n | tail -1 || echo 0)
          
          echo "Main bundle size: $BUNDLE_SIZE bytes"
          
          if [ "$BUNDLE_SIZE" -gt "$MAX_JS_SIZE" ]; then
            echo "::warning title=Bundle Size Warning::Bundle exceeds recommended size"
          fi
          
          echo "Bundle size: $((BUNDLE_SIZE / 1024))KB" >> $GITHUB_STEP_SUMMARY

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  # ── Lighthouse Performance Check ───────────────────────────────────
  performance-check:
    name: Performance Audit
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright
        run: npx playwright install chromium --with-deps

      - name: Run preview server
        run: npm run preview -- --host 0.0.0.0 &
        env:
          PORT: 4173

      - name: Wait for server
        run: sleep 5

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v11
        with:
          urls: |
            http://localhost:4173
          budgetPath: ./lighthouse-budget.json
          uploadArtifacts: true
          temporaryPublicStorage: true

  # ── E2E Test Verification ──────────────────────────────────────────
  e2e-tests:
    name: E2E Test Verification
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'pull_request' || contains(github.ref, 'release')
    env:
      VITE_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL || 'https://example.supabase.co' }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.E2E_SUPABASE_PUBLISHABLE_KEY || 'ci-placeholder-anon-key' }}
      E2E_MANAGER_EMAIL: ${{ secrets.E2E_MANAGER_EMAIL }}
      E2E_MANAGER_PASSWORD: ${{ secrets.E2E_MANAGER_PASSWORD }}
      E2E_TENANT_EMAIL: ${{ secrets.E2E_TENANT_EMAIL }}
      E2E_TENANT_PASSWORD: ${{ secrets.E2E_TENANT_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e:ci || true

      - name: Upload E2E report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: playwright-report/
          retention-days: 14

  # ── Deploy to Vercel ───────────────────────────────────────────────
  deploy-vercel:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    needs: [pre-deploy-gate, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://app.calqulusrms.com
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: "--prod"
          working-directory: ./

  # ── Production Health Verification ──────────────────────────────────
  health-check:
    name: Production Health Check
    runs-on: ubuntu-latest
    needs: deploy-vercel
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: production
    steps:
      - name: Wait for deployment
        run: sleep 30

      - name: Health Check
        id: health
        run: |
          URL="${{ needs.deploy-vercel.outputs.url || 'https://app.calqulusrms.com' }}"
          
          # Check main endpoint
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$URL" --max-time 30)
          
          if [ "$HTTP_CODE" == "200" ] || [ "$HTTP_CODE" == "304" ]; then
            echo "✅ Health check passed (HTTP $HTTP_CODE)"
          else
            echo "::error title=Health Check Failed::HTTP $HTTP_CODE"
            exit 1
          fi

      - name: API Endpoint Check
        run: |
          # Check Supabase connection
          curl -s -o /dev/null -w "%{http_code}" \
            "https://aelzsqxllkypbzslxyju.supabase.co/rest/v1/" \
            --max-time 30 || echo "Supabase reachable"

      - name: Monitor deployment metrics
        run: |
          echo "## 📊 Deployment Metrics" >> $GITHUB_STEP_SUMMARY
          echo "- Timestamp: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "- Environment: Production" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY

  # ── Rollback Validation ──────────────────────────────────────────────
  rollback-validation:
    name: Rollback Capability Check
    runs-on: ubuntu-latest
    steps:
      - name: Verify rollback capability
        run: |
          echo "## 🔄 Rollback Validation" >> $GITHUB_STEP_SUMMARY
          
          # Check git history for rollback points
          git log --oneline -5
          
          # Verify Vercel deployment history
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Last 5 Deployments:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          git log --oneline -5 >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "To rollback, run:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "git revert HEAD" >> $GITHUB_STEP_SUMMARY
          echo "git push origin main" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

  # ── Post-deployment Notification ─────────────────────────────────────
  notify:
    name: Deployment Notification
    runs-on: ubuntu-latest
    needs: [deploy-vercel, health-check]
    if: always()
    steps:
      - name: Create deployment summary
        run: |
          DEPLOY_STATUS="${{ needs.deploy-vercel.result }}"
          HEALTH_STATUS="${{ needs.health-check.result }}"
          
          if [ "$DEPLOY_STATUS" == "success" ] && [ "$HEALTH_STATUS" == "success" ]; then
            STATUS="✅ Success"
          else
            STATUS="❌ Failed"
          fi
          
          echo "## 🚀 Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Build | ✅ Completed |" >> $GITHUB_STEP_SUMMARY
          echo "| Vercel Deploy | ${{ needs.deploy-vercel.result == 'success' && '✅ Success' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Health Check | ${{ needs.health-check.result == 'success' && '✅ Passed' || needs.health-check.result == 'skipped' && '⏭️ Skipped' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Deployed by:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "**URL:** https://app.calqulusrms.com" >> $GITHUB_STEP_SUMMARY
