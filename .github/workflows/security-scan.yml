name: Security Scan

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
  schedule:
    # Run security scans weekly on Sunday at 2 AM
    - cron: "0 2 * * 0"

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Secret Scanning ──────────────────────────────────────────────────
  secrets-scan:
    name: Secret Detection
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run GitLeaks
        uses: gitleaks/gitleaks-action@v2
        with:
          config-path: .gitleaks.toml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Monitor for leaked secrets
        if: github.event_name == 'schedule'
        run: |
          echo "::notice title=Secret Scan:: Leaked secrets scan completed"

  # ── Dependency Security Audit ─────────────────────────────────────────
  dependency-audit:
    name: Dependency Security Audit
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        id: audit
        run: |
          npm audit --audit-level=high --json > audit-results.json 2>&1 || true
          # Count vulnerabilities
          if [ -f audit-results.json ]; then
            CRITICAL=$(grep -o '"critical":[0-9]*' audit-results.json | grep -o '[0-9]*' || echo 0)
            HIGH=$(grep -o '"high":[0-9]*' audit-results.json | grep -o '[0-9]*' || echo 0)
            echo "CRITICAL_VULNS=$CRITICAL" >> $GITHUB_ENV
            echo "HIGH_VULNS=$HIGH" >> $GITHUB_ENV
            
            if [ "$CRITICAL" -gt 0 ]; then
              echo "::error title=Critical Vulnerabilities Found::$CRITICAL critical vulnerabilities detected"
              exit 1
            fi
          fi

      - name: Upload audit results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: audit-results.json
          category: npm-audit

      - name: Comment on PR with audit results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const auditData = fs.readFileSync('audit-results.json', 'utf8');
            const results = JSON.parse(auditData);
            
            const critical = results.metadata?.vulnerabilities?.critical || 0;
            const high = results.metadata?.vulnerabilities?.high || 0;
            
            if (critical > 0 || high > 0) {
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: `## 🔒 Security Audit Results\n\n⚠️ **Vulnerabilities Detected**\n- Critical: ${critical}\n- High: ${high}\n\nPlease review and fix these before merging.`
              });
            }

  # ── CodeQL Security Analysis ───────────────────────────────────────
  codeql-security:
    name: CodeQL Security Analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript
          queries: security-extended

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript"

  # ── Dependency Health Check ───────────────────────────────────────────
  dependency-health:
    name: Dependency Health
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check for deprecated packages
        run: |
          npm ls --depth=0 2>/dev/null | grep -i deprecated && exit 1 || echo "No deprecated packages"

      - name: Check for outdated major versions
        run: node scripts/check-outdated-deps.mjs

      - name: Run npm outdated
        run: |
          npm outdated --depth=0 || true
          # Create summary for PR
          if [ -f outdated-summary.md ]; then
            echo "Outdated dependencies found - see below"
            cat outdated-summary.md
          fi

  # ── Supply Chain Security ────────────────────────────────────────────
  supply-chain:
    name: Supply Chain Security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify npm package integrity
        run: |
          npm ci --ignore-scripts 2>/dev/null
          npm audit --production --json > prod-audit.json 2>&1 || true
          echo "Production dependencies audited"

      - name: Check for known vulnerabilities in lock file
        run: |
          npm install --package-lock-only
          npm ls --depth=0 2>/dev/null | grep "UNMET" && exit 1 || echo "All dependencies resolved"

  # ── SBOM Generation ─────────────────────────────────────────────────
  sbom:
    name: Software Bill of Materials
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install CycloneDX
        run: npm install -g @cyclonedx/cyclonedx-npm

      - name: Generate SBOM
        run: |
          npx @cyclonedx/cyclonedx-npm --output-file sbom.json --output-format json
          npx @cyclonedx/cyclonedx-npm --output-file sbom.xml --output-format xml

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: |
            sbom.json
            sbom.xml
          retention-days: 90

  # ── Security Summary ────────────────────────────────────────────────
  security-summary:
    name: Security Scan Summary
    runs-on: ubuntu-latest
    needs: [secrets-scan, dependency-audit, codeql-security, dependency-health]
    if: always()
    steps:
      - name: Summary
        run: |
          echo "## 🔒 Security Scan Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Check status of each job
          if [[ "${{ needs.secrets-scan.result }}" == "success" ]]; then
            echo "✅ Secret Scanning: Passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Secret Scanning: Failed" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [[ "${{ needs.dependency-audit.result }}" == "success" ]]; then
            echo "✅ Dependency Audit: Passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Dependency Audit: Failed" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [[ "${{ needs.codeql-security.result }}" == "success" ]]; then
            echo "✅ CodeQL Analysis: Passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ CodeQL Analysis: Failed" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [[ "${{ needs.dependency-health.result }}" == "success" ]]; then
            echo "✅ Dependency Health: Passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Dependency Health: Failed" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "View detailed reports in the Security tab of this repository." >> $GITHUB_STEP_SUMMARY
