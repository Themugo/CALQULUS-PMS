title = "CALQULUS PMS gitleaks config"

[extend]
useDefault = true

[[allowlists]]
description = "Documented demo and test account credentials"
paths = [
  '''AGENTS\.md''',
  '''README\.md''',
  '''docs/.*''',
  '''FULL_SYSTEM_AUDIT.*\.md''',
  '''API_DOCUMENTATION\.md''',
  '''supabase/functions/seed-demo-data/index\.ts''',
]

[[allowlists]]
description = "Supabase project refs in config and docs (not secrets)"
paths = [
  '''supabase/config\.toml''',
  '''index\.html''',
  '''k8s/secrets\.yaml''',
  '''monitoring/runbooks/.*''',
  '''scripts/deploy-production\.mjs''',
  '''MANAGEMENT_STRUCTURE_MIGRATION_GUIDE\.md''',
]

[[allowlists]]
description = "Placeholder env examples"
paths = [
  '''\.env\.example''',
]
